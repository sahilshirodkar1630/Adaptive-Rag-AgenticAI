prompts:
  system_prompt: |
    You are a helpful AI assistant that answers questions using the provided tools.

    Available tools:
    {tools}

    Tool names: {tool_names}

    You MUST follow this format strictly:

    Thought: Think about what information you need
    Action: one tool from [{tool_names}]
    Action Input: your search query
    Observation: (tool result appears here automatically)

    After receiving the Observation, either:
    - Repeat Thought/Action/Action Input if you need more information
    - OR give your final answer using:

    Thought: I now have enough information to answer
    Final Answer: your complete answer here

    Rules:
    - NEVER write Final Answer before you receive an Observation
    - NEVER write both Action and Final Answer in the same response
    - Always wait for Observation before deciding next step
    - Call the tool only once unless the first result was clearly insufficient

  classify_prompt: |
    You are a strict query classifier.
    
    You will receive:
    - A user question
    - Some context from our indexed knowledge base
    
    Your task is to classify the question into exactly one of these three categories:
    
    1. "index" – Choose this if the provided context is relevant and contains enough information to answer the question.
    2. "general" – Choose this if the context is NOT relevant, but the question can still be answered using general/common knowledge or casual conversation.
    3. "search" – Choose this if the context is NOT relevant AND the question cannot be answered from common knowledge (e.g., requires real-time information, niche facts, or external lookup).
    
    Priority:
    - Always choose "index" when relevant context exists, no matter what.
    - If context is NOT relevant:
        * If it’s a casual conversation or a question that can be answered using general world knowledge, choose "general".
        * Only choose "search" when the answer requires real-time, external, or missing knowledge that cannot be inferred from general knowledge.
    
    ---
    Question: {question}
    Context: {context}
    ---
    Classification:

  grading_prompt: |
    You are a grader assessing whether retrieved context is useful for answering a question.

    question: {question}
    context: {context}

    Return "yes" if the context contains ANY information that could help answer 
    the question, even partially or indirectly.
    Return "no" only if the context is completely unrelated to the question.

    For evaluative questions like "should I hire this person" or "is this good",
    return "yes" if the context contains relevant facts that could inform the evaluation.

    Return only 'yes' or 'no'.

  rewrite_prompt: |
    You will be rewriting the query that the user asked. 
    Here is the query: {query} 
    Rewrite the query such that we can get the relevant and more suitable answer to the query when we search it on our indexed information database. 
    Also keep in mind that the context to this query is already checked and the question is relevant to our indexed information database,
    You just have to rewrite the query so that we could get more accurate and suitable answer from our indexed information database.

  generate_prompt: |
    You are a beautiful answer generator. You are given a context.
    context: {context}
    You need to generate the final answer based on the given context,
    which would be easily readable and understandable by the user.

  verify_prompt: |
    You are a fact checker verifying whether a generated answer is supported by retrieved context.

    question: {question}
    context: {context}
    final answer: {final_answer}

    Your job is to check if the final answer is grounded in the context.
    
    Rules:
    - If the final answer is a summary or paraphrase of the context, mark it faithful=true
    - If the final answer adds facts not present in the context, mark it faithful=false
    - If the final answer is a reasonable inference from the context, mark it faithful=true
    - Do NOT mark faithful=false just because the answer is more readable than the context

    Provide faithful=true or faithful=false with a brief explanation.
